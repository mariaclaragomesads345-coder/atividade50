function atualizarFisica(dt) {

    const suavizacao = 0.8;

    for (let i = 0; i < PARTICULAS; i++) {

        const k = i * 3;

        const x = posicoes[k];

        const y = posicoes[k + 1];

        const z = posicoes[k + 2];

        const distancia2 =
            x*x + y*y + z*z + suavizacao*suavizacao;
         
        const inverso =
            GRAVIDADE /
         Math.pow(distancia2, 1.5);


         const ax = -x * inverso;

         const ay = -y * inverso;

         const az = -z * inverso;


         velocidades[k] += ax * dt;

         velocidades[k + 1] += ay * dt;

         velocidade[k + 2] += az * dt;


         posicoes[k] += velocidades[k] * dt;

         posicoes[k + 1] += velocidades[k + 1] * dt;

         posicoes[k + 2] += velocidades[k + 2] * dt;
    }
